name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run demo
  caps:
    name: document word caps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check hard caps
        run: |
          check() { n=$(wc -w < "$1"); echo "$1: $n / $2"; [ "$n" -le "$2" ]; }
          check docs/GAP-ANALYSIS.md 1000
          check docs/ARCHITECTURE.md 600
          check docs/DECISION-SPEC.md 900
          check docs/AGENT-LANE.md 500
          check docs/MANUAL-OUTLINE.md 600
          check docs/ANALYSIS.md 1200
          lines=$(cat src/*.js src/store/*.js | wc -l); echo "src lines: $lines"; [ "$lines" -le 720 ]
